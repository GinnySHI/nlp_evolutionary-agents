[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-agents"
version = "0.1.0"
description = "A resumable multi-agent collaboration platform for HKGAI and DeepSeek"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
evo = "evoagents.cli:main"

[tool.setuptools.packages.find]
include = ["evoagents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
